<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div id="error" class="error hidden"></div>

    <div class="friends-box hidden">
    <h2>Your Friends</h2>
    <div id="friendsList"></div>
</div>


    <h1 class="title">Invite‑Only Chat</h1>

    <!-- LOGIN BOX -->
    <div class="login-box">
        <h2>Login</h2>
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <button onclick="signup()">Sign Up</button>
    </div>

    <!-- PROFILE BOX -->
    <div class="profile-box hidden">
        <h2>Your Profile</h2>
        <input id="username" type="text" placeholder="Custom Name">
        <input id="pfp" type="file" accept="image/png">
        <button onclick="saveProfile()">Save Profile</button>
    </div>

    <input id="friendEmail" type="email" placeholder="Friend's Email">
<button onclick="sendFriendRequest()">Add Friend</button>

    <div class="friend-requests-box hidden">
    <h2>Friend Requests</h2>
    <div id="friendRequests"></div>
</div>


    <!-- CHAT BOX -->
    <div class="chat-box hidden">
        <h2>Chat</h2>
        <div id="messages"></div>
        <input id="msg" type="text" placeholder="Message">
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<!-- Load your full Firebase backend -->
<script type="module" src="app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="topBar">
    <img id="profilePicButton" src="" alt="Profile" class="top-profile-pic">
</div>

    <div id="topBar" class="hidden">
    <img id="profilePicButton" src="" class="top-profile-pic">
</div>

    
<div class="container">

<div class="settings-box hidden">
    <h2>Profile Settings</h2>

    <label>Change Username</label>
    <input id="newUsername" type="text" placeholder="New Username">
    <button onclick="updateUsername()">Save Username</button>

    <label>Change Profile Picture</label>
    <input id="newPfp" type="file" accept="image/png">
    <button onclick="updateProfilePicture()">Save Picture</button>

    <h3>Your Friends</h3>
    <div id="settingsFriendsList"></div>
</div>

    
    <div class="friends-box hidden">
    <h2>Your Friends</h2>
    <div id="friendsList"></div>
</div>


    <div id="error" class="error hidden"></div>

    <div class="friends-box hidden">
    <h2>Your Friends</h2>
    <div id="friendsList"></div>
</div>


    <h1 class="title">Invite‑Only Chat</h1>

    <!-- LOGIN BOX -->
    <div class="login-box">
        <h2>Login</h2>
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <button onclick="signup()">Sign Up</button>
    </div>

    <!-- PROFILE BOX -->
    <div class="profile-box hidden">
        <h2>Your Profile</h2>
        <input id="username" type="text" placeholder="Custom Name">
        <input id="pfp" type="file" accept="image/png">
        <button onclick="saveProfile()">Save Profile</button>
    </div>

    <div class="friend-requests-box hidden">
    <h2>Friend Requests</h2>
    <div id="friendRequests"></div>
</div>


    <!-- CHAT BOX -->
    <div class="chat-box hidden">
        <h2>Chat</h2>
        <div id="messages"></div>
        <input id="msg" type="text" placeholder="Message">
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<!-- Load your full Firebase backend -->
<script type="module" src="app.js"></script>

</body>
</html>
